
{% extends 'base.html' %}

{% block title %}Student Profile{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow border-0 rounded-4">

            <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">

                <h2 class="fw-bold mb-1">Student Profile</h2>
                <p class="mb-0">Your Personal Information</p>

            </div>

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                         style="width: 90px; height: 90px; font-size: 35px;">

                        {{ student.name|first|upper }}

                    </div>

                    <h4 class="mt-3 fw-bold">{{ student.name }}</h4>
                    <p class="text-muted">Student Account</p>

                </div>

                <div class="mb-3">
                    <label class="fw-bold text-muted">Student ID</label>
                    <input type="text" class="form-control"
                           value="{{ student.id }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="fw-bold text-muted">Full Name</label>
                    <input type="text" class="form-control"
                           value="{{ student.name }}" readonly>
                </div>

                <div class="mb-3">
                    <label class="fw-bold text-muted">Email Address</label>
                    <input type="email" class="form-control"
                           value="{{ student.email }}" readonly>
                </div>

                <div class="mb-4">
                    <label class="fw-bold text-muted">Phone Number</label>
                    <input type="text" class="form-control"
                           value="{{ student.phone_number }}" readonly>
                </div>

                <a href="{% url 'edit_profile' %}"
                   class="btn btn-warning w-100 mb-2">
                    Edit Profile
                </a>

                <a href="{% url 'dashboard' %}"
                   class="btn btn-primary w-100">
                    Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
